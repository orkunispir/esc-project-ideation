name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-validation:
    name: Offline unit and structural checks
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Python unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run Edge Function contract tests
        run: node supabase/tests/request_test.ts

      - name: Run bundle and public-boundary checks
        run: bash scripts/check_bundle.sh
